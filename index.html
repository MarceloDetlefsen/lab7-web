<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblically Accurate Angels</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel (to use JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: monospace;
        color: white;
      }
      .info {
        margin-bottom: 10px;
        font-size: 14px;
        color: #aaa;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(15, 50px);
        grid-template-rows: repeat(15, 50px);
        border: 2px solid #444;
      }
      .first-screen {
        width: 750px;
        height: 750px;
        border: 2px solid #44ff44;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .first-screen h1 {
        color: #44ff44;
        font-size: 36px;
        margin: 0 0 8px;
      }
      .first-screen p {
        color: #aaa;
        font-size: 14px;
        margin: 0;
      }
      .first-screen button {
        margin-top: 24px;
        padding: 12px 40px;
        background: transparent;
        color: #44ff44;
        border: 2px solid #44ff44;
        font-family: monospace;
        font-size: 16px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: background 0.15s, color 0.15s;
      }
      .first-screen button:hover {
        background: #44ff44;
        color: #111;
      }
      .game-over-screen {
        width: 750px;
        height: 750px;
        border: 2px solid #ff4444;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .game-over-screen h1 {
        color: #ff4444;
        font-size: 36px;
        margin: 0;
      }
      .game-over-screen p {
        color: #aaa;
        font-size: 14px;
        margin: 0;
      }
      .game-over-screen .score {
        color: white;
        font-size: 22px;
        margin: 8px 0;
      }
    </style>

    <div id="root"></div>

    <script type="text/babel">
      const root = document.getElementById("root");
      const reactRoot = ReactDOM.createRoot(root);

      const INITIAL_SNAKE = [{ x: 8, y: 8 }]

      const randomPos = (snake) => {
        let pos
        do {
          pos = {
            x: Math.floor(Math.random() * 15) + 1,
            y: Math.floor(Math.random() * 15) + 1
          }
        } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y))
        return pos
      }

      const Segment = ({ x, y, isHead }) => {
        const style = {
          width: "50px",
          height: "50px",
          background: isHead ? 'greenyellow' : 'green',
          boxSizing: "border-box",
          border: "1px solid black",
          gridColumn: x,
          gridRow: y
        }
        React.useEffect(() => {
          console.log(`Segment at x: ${x}, y: ${y} rendered`);
        }, [x, y])
        return <div style={style} />
      }

      const Food = ({ x, y }) => {
        const style = {
          width: "50px",
          height: "50px",
          boxSizing: "border-box",
          gridColumn: x,
          gridRow: y,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontSize: "24px",
          lineHeight: 1
        }
        return <div style={style}>🍎</div>
      }

      const Score = ({ score }) => {
        return <span>Puntaje: {score}</span>
      }

      const Game = () => {
        const [direction, setDirection] = React.useState('ArrowRight')
        const [snake, setSnake] = React.useState(INITIAL_SNAKE)
        const [food, setFood] = React.useState(() => randomPos(INITIAL_SNAKE))
        const [score, setScore] = React.useState(0)
        const [gameOver, setGameOver] = React.useState(false)
        const [firstScreen, setFirstScreen] = React.useState(true)
        const [deathReason, setDeathReason] = React.useState('')
        const [dying, setDying] = React.useState(false)

        const foodRef = React.useRef(food)
        React.useEffect(() => { foodRef.current = food }, [food])

        const reset = () => {
          setSnake(INITIAL_SNAKE)
          setFood(randomPos(INITIAL_SNAKE))
          setScore(0)
          setDirection('ArrowRight')
          setGameOver(false)
          setFirstScreen(true)
          setDeathReason('')
          setDying(false)
        }

        React.useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === 'r' || e.key === 'R') {
              reset()
              return
            }
            const map = {
              'ArrowRight': 'ArrowRight', 'd': 'ArrowRight', 'D': 'ArrowRight',
              'ArrowLeft':  'ArrowLeft',  'a': 'ArrowLeft',  'A': 'ArrowLeft',
              'ArrowUp':    'ArrowUp',    'w': 'ArrowUp',    'W': 'ArrowUp',
              'ArrowDown':  'ArrowDown',  's': 'ArrowDown',  'S': 'ArrowDown',
            }
            if (map[e.key]) setDirection(map[e.key])
          }
          window.addEventListener('keydown', handleKeyDown)
          return () => window.removeEventListener('keydown', handleKeyDown)
        }, [])

        React.useEffect(() => {
          if (gameOver || dying || firstScreen) return

          const i = setInterval(() => {
            setSnake((oldSnake) => {
              const newHead = { ...oldSnake[0] }
              switch (direction) {
                case 'ArrowRight': newHead.x = newHead.x + 1; break;
                case 'ArrowLeft':  newHead.x = newHead.x - 1; break;
                case 'ArrowUp':    newHead.y = newHead.y - 1; break;
                case 'ArrowDown':  newHead.y = newHead.y + 1; break;
              }

              // Colision con pared
              if (newHead.x < 1 || newHead.x > 15 || newHead.y < 1 || newHead.y > 15) {
                setDeathReason('Chocaste con la pared')
                setGameOver(true)
                return oldSnake
              }

              // Colision con si misma
              const body = oldSnake.slice(0, oldSnake.length - 1)
              const hitSelf = body.some(seg => seg.x === newHead.x && seg.y === newHead.y)
              if (hitSelf) {
                setDeathReason('Chocaste contigo mismo')
                setDying(true)
                setTimeout(() => setGameOver(true), 1000)
                return oldSnake
              }

              // Comio la manzana
              const currentFood = foodRef.current
              const newSnake = [newHead, ...oldSnake]
              if (newHead.x === currentFood.x && newHead.y === currentFood.y) {
                setScore((s) => s + 1)
                setFood(randomPos(newSnake))
              } else {
                newSnake.pop()
              }

              return newSnake
            })
          }, 200)
          return () => clearInterval(i)
        }, [direction, gameOver, dying, firstScreen])

        if (firstScreen) {
          return (
            <div className="first-screen">
              <h1>SNAKE GAME</h1>
              <p>Usa las flechas o WASD para moverte</p>
              <p>Presiona R para reiniciar en cualquier momento</p>
              <p>¡Come la manzana para crecer y aumentar tu puntuación!</p>
              <p>¡Evita chocar con las paredes o contigo mismo!</p>
              <button onClick={() => setFirstScreen(false)}>JUGAR</button>
            </div>
          )
        }

        if (gameOver) {
          return (
            <div className="game-over-screen">
              <h1>GAME OVER</h1>
              <p>{deathReason}</p>
              <p className="score">Puntaje final: {score}</p>
              <p>Presiona R para reiniciar</p>
            </div>
          )
        }

        return (
          <>
            <div className="info">
              <Score score={score} />
            </div>
            <main className="board">
              {snake.map((part, index) => (
                <Segment key={index} x={part.x} y={part.y} isHead={index === 0} />
              ))}
              <Food x={food.x} y={food.y} />
            </main>
          </>
        )
      }

      const App = () => {
        return (
          <Game />
        )
      }

      reactRoot.render(<App />);
    </script>
  </body>
</html>
