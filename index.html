<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblically Accurate Angels</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel (to use JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: monospace;
        color: white;
      }
      .info {
        margin-bottom: 10px;
        font-size: 14px;
        color: #aaa;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(15, 50px);
        grid-template-rows: repeat(15, 50px);
        border: 2px solid #444;
        cursor: pointer;
      }
      .game-over-screen {
        width: 750px;
        height: 750px;
        border: 2px solid #ff4444;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .game-over-screen h1 {
        color: #ff4444;
        font-size: 36px;
        margin: 0;
      }
      .game-over-screen p {
        color: #aaa;
        font-size: 14px;
        margin: 0;
      }
    </style>

    <div id="root"></div>

    <script type="text/babel">
      const root = document.getElementById("root");
      const reactRoot = ReactDOM.createRoot(root);

      const INITIAL_SNAKE = [
        { x: 7, y: 8 },
        { x: 6, y: 8 },
        { x: 5, y: 8 }
      ]

      const Segment = ({ x, y }) => {
        const style = {
          width: "50px",
          height: "50px",
          background: "green",
          boxSizing: "border-box",
          border: "1px solid black",
          gridColumn: x,
          gridRow: y
        }
        React.useEffect(() => {
          console.log(`Segment at x: ${x}, y: ${y} rendered`);
        }, [x, y])
        return <div style={style} />
      }

      const Game = () => {
        const [direction, setDirection] = React.useState('ArrowRight')
        const [length, setLength] = React.useState(3)
        const [snake, setSnake] = React.useState(INITIAL_SNAKE)
        const [gameOver, setGameOver] = React.useState(false)

        const reset = () => {
          setSnake(INITIAL_SNAKE)
          setLength(3)
          setDirection('ArrowRight')
          setGameOver(false)
        }

        React.useEffect(() => {
          const onClick = () => {
            if (!gameOver) setLength((prevLength) => prevLength + 1)
          }
          window.addEventListener('click', onClick)
          return () => window.removeEventListener('click', onClick)
        }, [gameOver])

        React.useEffect(() => {
          const handleKeyDown = (e) => {
            // Restart
            if (e.key === 'r' || e.key === 'R') {
              reset()
              return
            }
            // Direcciones — arrows y WASD
            const map = {
              'ArrowRight': 'ArrowRight', 'd': 'ArrowRight', 'D': 'ArrowRight',
              'ArrowLeft':  'ArrowLeft',  'a': 'ArrowLeft',  'A': 'ArrowLeft',
              'ArrowUp':    'ArrowUp',    'w': 'ArrowUp',    'W': 'ArrowUp',
              'ArrowDown':  'ArrowDown',  's': 'ArrowDown',  'S': 'ArrowDown',
            }
            if (map[e.key]) setDirection(map[e.key])
          }
          window.addEventListener('keydown', handleKeyDown)
          return () => window.removeEventListener('keydown', handleKeyDown)
        }, [])

        React.useEffect(() => {
          if (gameOver) return

          const i = setInterval(() => {
            setSnake((oldSnake) => {
              const newHead = { ...oldSnake[0] }
              switch (direction) {
                case 'ArrowRight': newHead.x = newHead.x + 1; break;
                case 'ArrowLeft':  newHead.x = newHead.x - 1; break;
                case 'ArrowUp':    newHead.y = newHead.y - 1; break;
                case 'ArrowDown':  newHead.y = newHead.y + 1; break;
              }

              if (newHead.x < 1 || newHead.x > 15 || newHead.y < 1 || newHead.y > 15) {
                setGameOver(true)
                return oldSnake
              }

              return [newHead, ...oldSnake.slice(0, length - 1)]
            })
          }, 200)
          return () => clearInterval(i)
        }, [direction, length, gameOver])

        if (gameOver) {
          return (
            <div className="game-over-screen">
              <h1>GAME OVER</h1>
              <p>Chocaste con la pared</p>
              <p>Presiona R para reiniciar</p>
            </div>
          )
        }

        return (
          <>
            <div className="info">Longitud: {length} — clic para crecer</div>
            <main className="board">
              {snake.map((part, index) => (
                <Segment key={index} x={part.x} y={part.y} />
              ))}
            </main>
          </>
        )
      }

      const App = () => {
        return (
          <Game />
        )
      }

      reactRoot.render(<App />);
    </script>
  </body>
</html>
